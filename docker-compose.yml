version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: codeflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=codeflow-ai
    networks:
      - codeflow-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/codeflow-ai --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/codeflow-ai
      - FRONTEND_URL=http://localhost:3000
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - BOB_API_KEY=${BOB_API_KEY}
      - BOB_API_ENDPOINT=${BOB_API_ENDPOINT}
      - BOB_MODEL=${BOB_MODEL}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=104857600
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=7d
      - LOG_LEVEL=info
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - codeflow-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - codeflow-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  codeflow-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local
  backend-uploads:
    driver: local

