# Render Blueprint for CodeFlow AI
# This file enables one-click deployment to Render
# Place this file in the root of your repository

services:
  # Backend Web Service
  - type: web
    name: codeflow-ai-backend
    runtime: node
    region: oregon  # Choose: oregon, frankfurt, singapore
    plan: free      # Options: free, starter, standard, pro
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://acodeflow.netlify.app//api/auth/github/callback
      - key: SESSION_SECRET
        generateValue: true  # Render will generate a secure random value
      - key: BOB_API_KEY
        sync: false
      - key: BOB_API_ENDPOINT
        sync: false
      - key: BOB_MODEL
        value: bob-default
      - key: FRONTEND_URL
        value: https://acodeflow.netlify.app/
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 104857600

  # Frontend Static Site
  - type: web
    name: codeflow-ai-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://codeflow-ai-backend.onrender.com
      - key: REACT_APP_GITHUB_CLIENT_ID
        sync: false
      - key: REACT_APP_NAME
        value: CodeFlow AI
      - key: REACT_APP_VERSION
        value: 1.0.0
      # Firebase variables (optional - set if using Firebase)
      - key: REACT_APP_FIREBASE_API_KEY
        sync: false
      - key: REACT_APP_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: REACT_APP_FIREBASE_PROJECT_ID
        sync: false
      - key: REACT_APP_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: REACT_APP_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: REACT_APP_FIREBASE_APP_ID
        sync: false
      - key: REACT_APP_FIREBASE_MEASUREMENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

